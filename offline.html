<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>离线 · 宁夏自驾路书</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #ecebea;
        color: #23211f;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(24px, 6vw, 48px);
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 { font-size: 20px; margin: 0 0 12px; font-weight: 600; }
      p { font-size: 14px; line-height: 1.6; color: #4b4946; margin: 0 0 20px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        background: #2563eb;
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        min-width: 120px;
        min-height: 44px;
      }
      button:active { background: #1d4ed8; }
      .hint { font-size: 12px; color: #6b6864; margin-top: 24px; }
    </style>
  </head>
  <body>
    <main>
      <h1>当前没有网络</h1>
      <p>行程时间、地点、路线和里程已缓存，可以直接打开 app 继续查看；地图瓦片只缓存浏览过的部分，没去过的地方可能无法显示。</p>
      <button type="button" onclick="location.reload()">重试</button>
      <div class="hint">提示：连上 Wi-Fi 后已浏览过的地图会自动回到缓存。</div>
    </main>
  </body>
</html>
